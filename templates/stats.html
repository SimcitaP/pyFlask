<!DOCTYPE html>
<html>
<head>
  <title>African Mineral Statistics Dashboard</title>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      text-align: center;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
    }
    .chart-container {
      width: 85%;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<header>📊 African Mineral Statistics Dashboard</header>

<div class="chart-container">
  {{ country_chart | safe }}
</div>

<div class="chart-container">
  {{ stacked_chart | safe }}
</div>

<div class="chart-container">
  {{ gdp_chart | safe }}
</div>

<div class="chart-container">
  {{ map_chart | safe }}
</div>

</body>
</html>
